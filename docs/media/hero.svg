<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">PPT Cursor — Your next slide edit, together.</title>
<desc id="desc">An open-source PowerPoint companion for macOS. Workflow illustration: edit, preview, accept, continue.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f32"/><stop offset="1" stop-color="#12424b"/></linearGradient>
  <linearGradient id="card" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f0f8f8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".18"/></filter>
</defs>
<rect width="1280" height="560" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<rect x="64" y="60" width="116" height="30" rx="15" fill="#244653"/>
<text x="122" y="80" text-anchor="middle" fill="#93e8e1" font-size="12" font-weight="700" letter-spacing="1.4">OPEN SOURCE</text>
<text x="64" y="168" fill="white" font-size="62" font-weight="750" letter-spacing="-2">PPT Cursor</text>
<text x="64" y="232" fill="white" font-size="34" font-weight="600">Your next slide edit.</text>
<text x="64" y="279" fill="#7de1d7" font-size="34" font-weight="600">Made together.</text>
<text x="64" y="332" fill="#bdcfd5" font-size="19">Stay in PowerPoint. Preview the AI’s idea.</text>
<text x="64" y="363" fill="#bdcfd5" font-size="19">Keep the final say.</text>
<rect x="64" y="414" width="72" height="44" rx="10" fill="#f0fbf9"/>
<text x="100" y="443" text-anchor="middle" fill="#133b45" font-size="21" font-weight="700">Tab</text>
<text x="151" y="442" fill="#e2eeee" font-size="17">Preview → Accept → Continue</text>
<text x="64" y="512" fill="#91adb7" font-size="13">macOS · PowerPoint · Bring your model · MIT</text>
<g transform="translate(674 98)" filter="url(#shadow)">
  <rect width="542" height="340" rx="18" fill="url(#card)"/>
  <rect width="542" height="42" rx="18" fill="#e5eeee"/><path d="M0 22H542V42H0Z" fill="#e5eeee"/>
  <circle cx="22" cy="22" r="5" fill="#b3c8ca"/><circle cx="40" cy="22" r="5" fill="#b3c8ca"/><circle cx="58" cy="22" r="5" fill="#b3c8ca"/>
  <text x="271" y="27" fill="#58757e" text-anchor="middle" font-size="12">WORKFLOW ILLUSTRATION</text>
  <text x="40" y="104" fill="#183945" font-size="24" font-weight="700">From idea to the next edit</text>
  <g fill="#e3f2f0" stroke="#9ccfca"><rect x="40" y="147" width="124" height="76" rx="12"/><rect x="209" y="147" width="124" height="76" rx="12"/><rect x="378" y="147" width="124" height="76" rx="12"/></g>
  <g stroke="#168d88" stroke-width="2.5" fill="none"><path d="M174 185h24l-6-6m6 6-6 6"/><path d="M343 185h24l-6-6m6 6-6 6"/></g>
  <g fill="#174b55" text-anchor="middle" font-size="16" font-weight="600"><text x="102" y="191">You edit</text><text x="271" y="191">AI suggests</text><text x="440" y="191">You decide</text></g>
  <rect x="40" y="259" width="462" height="44" rx="10" fill="#153d49"/>
  <circle cx="62" cy="281" r="4" fill="#73ddd1"/><text x="77" y="287" fill="white" font-size="14">Editable shapes. Real assets. Your confirmation.</text>
</g>
<text x="945" y="479" text-anchor="middle" fill="#a0bec5" font-size="14">A companion for the editor you already use.</text>
</g></svg>
