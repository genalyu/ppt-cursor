name: Mac preview
on:
  push:
    branches: [main]
    tags: ['v*-preview.*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements.txt
      - run: ./Scripts/test-offline.sh
      - run: ./Scripts/package-mac.sh
        if: startsWith(github.ref, 'refs/tags/')
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: mac-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-package
          path: dist
      - name: Publish tested archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release create "$TAG" *.zip *.sha256 --repo "$REPOSITORY" --verify-tag --prerelease \
            --title "PPT Cursor $TAG" \
            --notes "macOS preview for the CPU architecture named in the ZIP. Requires macOS 13+, desktop PowerPoint, Python/Pillow, LibreOffice, and either a signed-in Codex CLI or a supported API connection. The app is ad-hoc signed and has not been notarized by Apple."
