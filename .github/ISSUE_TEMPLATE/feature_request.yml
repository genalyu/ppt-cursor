name: Feature request / 功能建议
description: Describe the editing workflow you want to improve.
title: "[Feature] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do? / 你希望完成什么？
      description: Describe the task and the current difficulty, with a concrete example.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior / 期望行为
      description: What should happen, and when should the user confirm it?
    validations:
      required: true
